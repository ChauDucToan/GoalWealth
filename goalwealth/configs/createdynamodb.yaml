AWSTemplateFormatVersion: '2010-09-09'
Description: GoalWealth Memory Table

Parameters:
  TableName:
    Type: String
    Default: GoalWealthMemory

Resources:
  MemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

Outputs:
  MemoryTableName:
    Description: Name of the memory table
    Value: !Ref MemoryTable

  MemoryTableArn:
    Description: ARN of the memory table
    Value: !GetAtt MemoryTable.Arn
